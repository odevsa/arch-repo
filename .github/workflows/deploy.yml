name: Build and Publish Arch Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: "Force rebuild of all packages"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore/Save packages cache
        uses: actions/cache@v4
        id: packages-cache
        with:
          path: public/
          key: arch-repo-packages-${{ github.run_id }}
          restore-keys: |
            arch-repo-packages-

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pacman-pkg-${{ runner.os }}-
            pacman-pkg-

      - name: Initialize Arch environment
        run: |
          pacman -Sy --noconfirm --needed base-devel git pacman-contrib

      - name: Configure non-root user (makepkg does not run as root)
        run: |
          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p public
          chown -R builder:builder ./

      - name: Build packages (incremental or full)
        run: |
          git config --global --add safe.directory "*"
          su builder -c "git config --global --add safe.directory '*'"

          mkdir -p public
          chown -R builder:builder public/

          EXISTING_PACKAGES=$(find public -name "*.pkg.tar.zst" 2>/dev/null | wc -l)
          FORCE_REBUILD="${{ inputs.force_rebuild_all }}"

          echo "Packages found in cache: $EXISTING_PACKAGES"

          if [ "$FORCE_REBUILD" = "true" ] || [ "$EXISTING_PACKAGES" -eq 0 ]; then
            echo ">> Performing full rebuild of all packages..."
            su builder -c "make build"
          else
            echo ">> Cache found. Determining modified packages..."

            BEFORE_SHA="${{ github.event.before }}"
            BASE_REF=""

            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              BASE_REF="$BEFORE_SHA"
            elif git cat-file -e "HEAD~1^{commit}" 2>/dev/null; then
              BASE_REF="HEAD~1"
            fi

            CHANGED_FILES=""
            if [ -n "$BASE_REF" ]; then
              echo ">> Comparing changes between $BASE_REF and HEAD..."
              CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD -- packages 2>/dev/null || true)
            else
              echo ">> Inspecting changes in HEAD commit..."
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD -- packages 2>/dev/null || true)
            fi

            CHANGED_PKGS=$(echo "$CHANGED_FILES" | awk -F/ '{print $2}' | sort -u | grep -v '^\.' || true)
            IGNORED_PKGS=$(cat packages/.ignore 2>/dev/null || true)
            PKGS_TO_BUILD=""
            for p in $CHANGED_PKGS; do
              if [ -d "packages/$p" ] && [ -f "packages/$p/PKGBUILD" ]; then
                if ! echo "$IGNORED_PKGS" | grep -qw "$p"; then
                  PKGS_TO_BUILD="$PKGS_TO_BUILD $p"
                fi
              fi
            done

            if [ -n "$PKGS_TO_BUILD" ]; then
              echo ">> Packages to build:$PKGS_TO_BUILD"
              su builder -c "make $PKGS_TO_BUILD"
            else
              echo ">> No packages in 'packages/' were modified in this commit."
            fi

            # Remove obsolete versions of updated packages
            paccache -r -k1 -c public/ || true

            # Update repository database and HTML index
            su builder -c "make database html"
          fi

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
